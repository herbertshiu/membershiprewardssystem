name: Daily article (domain 1-auto)

on:
  schedule:
    # 00:30 UTC daily ≈ 08:30 HKT
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "domain 1-auto"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate article
        id: gen
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node generate-page.js

      - name: Commit and push
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add article-*.html blog.html keywords-queue.json
          if git diff --staged --quiet; then
            echo "No changes to commit (queue may be empty)."
            exit 0
          fi
          git commit -m "Add article: ${TITLE:-$SLUG}"
          git push
